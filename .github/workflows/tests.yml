name: Run Tests

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Tests with Coverage
        id: run-tests
        run: |
          npm run test -- --coverage || {
            echo "::error::Unit tests failed! Please inspect test execution logs."
            exit 1
          }

      - name: Upload Coverage Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

      - name: Generate Step Summary
        if: always()
        run: |
          echo "### 🧪 Test Suite Execution Summary" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.run-tests.outcome }}" == "success" ]; then
            echo "✅ **All unit tests passed successfully!**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Test suite failed.** Check annotations or job output above for details." >> $GITHUB_STEP_SUMMARY
          fi
