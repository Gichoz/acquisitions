name: Lint and Format

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  lint-and-format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: |
          npm run lint || {
            echo "::error::ESLint failed! Fix issues locally by running: npm run lint:fix"
            exit 1
          }

      - name: Check Prettier formatting
        run: |
          npm run format:check || {
            echo "::error::Prettier check failed! Format code locally by running: npm run format"
            exit 1
          }
